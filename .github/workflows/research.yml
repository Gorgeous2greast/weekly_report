name: Agentic RL Reward Research

on:
  workflow_dispatch: # 允许手动点击运行
  schedule:
    - cron: '0 2 * * 1' # 每周一 UTC 2:00 (北京时间周一上午 10:00) 自动运行

permissions:
  contents: write # 需要写入权限，以便将生成的报告 Commit 回仓库

jobs:
  run-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Research Script
        env:
          # 直接复用你之前配置好的 Secrets
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python agentic_rl_reward_search.py

      - name: Commit Research Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add research_reports/
          git commit -m "Add Agentic RL Reward Research Report $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
